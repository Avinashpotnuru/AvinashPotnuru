<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="100%" role="img" aria-label="About Avinash: performance-first frontend developer, 5+ years, 5 products, 20% faster page loads, open to opportunities">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset=".6" stop-color="#0D1117"/><stop offset="1" stop-color="#0A161B"/></linearGradient>
<radialGradient id="spotg"><stop offset="0" stop-color="#00C9A7" stop-opacity=".16"/><stop offset=".55" stop-color="#38BDF8" stop-opacity=".07"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
<linearGradient id="topline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00C9A7" stop-opacity="0"/><stop offset=".35" stop-color="#00C9A7"/><stop offset=".65" stop-color="#38BDF8"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/><animate attributeName="x1" values="-0.3;0.3;-0.3" dur="8s" repeatCount="indefinite"/><animate attributeName="x2" values="0.7;1.3;0.7" dur="8s" repeatCount="indefinite"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 H0 V32" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/></pattern>
<clipPath id="panel"><rect x="0.5" y="0.5" width="999" height="209" rx="20"/></clipPath>
<style>
.reveal { transform-box: fill-box; transform-origin: center; animation: rise .9s cubic-bezier(.22,1,.36,1) both; }
.pop { transform-box: fill-box; transform-origin: center; animation: pop .8s cubic-bezier(.34,1.56,.64,1) both; }
.ring { transform-box: fill-box; transform-origin: center; animation: spin 36s linear infinite; }
.dot { transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-in-out infinite; }
.divider { transform-box: fill-box; transform-origin: center; animation: growY .9s cubic-bezier(.22,1,.36,1) both; }
.spot { transform-box: fill-box; transform-origin: center; animation: drift 12s ease-in-out infinite alternate; }
.txt, .micro, .num, .stat-label, .pill { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
.micro { fill: #00C9A7; font-size: 10px; font-weight: 700; letter-spacing: 3px; }
.txt { fill: #E6EDF3; font-size: 24px; font-weight: 700; letter-spacing: -0.4px; }
.num { fill: #E6EDF3; font-size: 34px; font-weight: 800; letter-spacing: -0.8px; font-variant-numeric: tabular-nums; }
.stat-label { fill: #8B949E; font-size: 11px; font-weight: 600; letter-spacing: .3px; }
.pill { fill: #9FE8D8; font-size: 10.5px; font-weight: 600; letter-spacing: .3px; }
@keyframes rise { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes pop { 0% { opacity: 0; transform: scale(.75); } 100% { opacity: 1; transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes ping { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.55); opacity: .45; } }
@keyframes growY { 0% { transform: scaleY(0); opacity: 0; } 100% { transform: scaleY(1); opacity: 1; } }
@keyframes drift { 0% { transform: translate(0,0); } 100% { transform: translate(-60px,14px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</defs>
<rect x="0.5" y="0.5" width="999" height="209" rx="20" fill="url(#bg)" stroke="#1E293B" stroke-width="1"/>
<g clip-path="url(#panel)">
<rect x="0" y="0" width="1000" height="210" fill="url(#grid)"/>
<circle class="spot" cx="720" cy="30" r="210" fill="url(#spotg)"/>
<circle cx="60" cy="196" r="150" fill="#00C9A7" opacity=".045"/>
</g>
<rect x="30" y="0" width="240" height="2" rx="1" fill="url(#topline)"/>
<g class="reveal">
<circle cx="88" cy="104" r="40" fill="#0F1B1A" stroke="#1E3B36" stroke-width="1"/>
<circle class="ring" cx="88" cy="104" r="50" fill="none" stroke="#00C9A7" stroke-opacity=".38" stroke-width="1.5" stroke-dasharray="2 9" stroke-linecap="round"/>
<text x="88" y="114" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#E6EDF3" letter-spacing="1">AP</text>
</g>
<text class="micro" x="164" y="74">FRONTEND DEVELOPER</text>
<text class="txt" x="162" y="106">Fast interfaces.</text>
<text class="txt" x="162" y="134">Built to scale.</text>
<g class="reveal" style="animation-delay:.25s">
<rect x="160" y="156" width="176" height="26" rx="13" fill="#0F1B1A" stroke="#1E3B36" stroke-width="1"/>
<circle class="dot" cx="176" cy="169" r="3.4" fill="#00C9A7"/>
<text class="pill" x="187" y="173">Open to opportunities</text>
</g>
<line class="divider" style="animation-delay:.15s" x1="400" y1="34" x2="400" y2="176" stroke="#1E293B" stroke-width="1"/>
<line class="divider" style="animation-delay:.3s" x1="592" y1="64" x2="592" y2="146" stroke="#1E293B" stroke-width="1"/>
<line class="divider" style="animation-delay:.38s" x1="784" y1="64" x2="784" y2="146" stroke="#1E293B" stroke-width="1"/>
<g class="pop" style="animation-delay:0.2s">
<text class="num" x="430" y="103" fill="#00C9A7">05+</text>
<text class="stat-label" x="430" y="126">Years of experience</text>
<rect x="430" y="141" width="26" height="2" rx="1" fill="#00C9A7" opacity=".5"/>
</g>
<g class="pop" style="animation-delay:0.32s">
<text class="num" x="622" y="103" fill="#E6EDF3">05</text>
<text class="stat-label" x="622" y="126">Products shipped</text>
<rect x="622" y="141" width="26" height="2" rx="1" fill="#00C9A7" opacity=".5"/>
</g>
<g class="pop" style="animation-delay:0.44s">
<text class="num" x="814" y="103" fill="#E6EDF3">20%</text>
<text class="stat-label" x="814" y="126">Faster page loads</text>
<rect x="814" y="141" width="26" height="2" rx="1" fill="#00C9A7" opacity=".5"/>
</g>
</svg>
