<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 214" width="100%" role="img" aria-label="Monthly contributions, October 2025 to October 2026, peaking at 35 in Sep 2026">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset=".6" stop-color="#0D1117"/><stop offset="1" stop-color="#0A161B"/></linearGradient>
<radialGradient id="spotg"><stop offset="0" stop-color="#00C9A7" stop-opacity=".12"/><stop offset=".55" stop-color="#38BDF8" stop-opacity=".05"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 H0 V32" fill="none" stroke="#FFFFFF" stroke-opacity=".03" stroke-width="1"/></pattern>
<clipPath id="panel"><rect x="0.5" y="0.5" width="999" height="213" rx="20"/></clipPath>
<linearGradient id="barfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2FE6C8"/><stop offset="1" stop-color="#0A9C86"/></linearGradient>
<style>
text { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
.micro { fill: #00C9A7; font-size: 8px; font-weight: 700; letter-spacing: 2.2px; }
.meta { fill: #6E7681; font-size: 8px; font-weight: 700; letter-spacing: 1.8px; }
.rise { animation: rise .8s cubic-bezier(.22,1,.36,1) both; }
.fade { animation: fade .9s ease-out both; }
@keyframes rise { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes fade { 0% { opacity: 0; } 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.gridline { animation: fade .9s ease-out both; }
.bar { transform-box: fill-box; transform-origin: center bottom; animation: growY .9s cubic-bezier(.22,1,.36,1) both; }
.val { fill: #8B949E; font-size: 10px; font-weight: 700; }
.mon { fill: #6E7681; font-size: 9px; font-weight: 600; }
@keyframes growY { 0% { transform: scaleY(0); } 100% { transform: scaleY(1); } }
</style>
